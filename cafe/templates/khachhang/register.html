{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Thành Viên | CafeHouse</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --primary: #1e7f3f;
            --secondary: #1a0f0d;
            --bg-page: #f8f5f2;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-page);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .auth-card {
            background: #fff;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            border: none;
        }

        .auth-logo {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 28px;
            color: var(--primary);
            text-align: center;
            margin-bottom: 30px;
            text-decoration: none;
            display: block;
        }

        .auth-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--secondary);
            text-align: center;
            margin-bottom: 25px;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 15px;
            border: 1px solid #eee;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.25rem rgba(30, 127, 63, 0.1);
        }

        .btn-auth {
            background: var(--primary);
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            border: none;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-auth:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }

        .error-msg {
            background: #fff5f5;
            color: #e53e3e;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #feb2b2;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="auth-card animate__animated animate__fadeIn">
    <a href="/" class="auth-logo">CAFEHOUSE</a>
    <h2 class="auth-title">Tham gia cùng chúng tôi</h2>

    {% if error %}
        <div class="error-msg">
            <i class="fa-solid fa-circle-exclamation me-2"></i> {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        
        <div class="mb-3">
            <label class="form-label small fw-bold text-muted">TÊN ĐĂNG NHẬP</label>
            <input type="text" name="username" class="form-control" placeholder="Nhập tên tài khoản" required>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-bold text-muted">MẬT KHẨU</label>
            <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
        </div>

        <button type="submit" class="btn btn-auth">ĐĂNG KÝ NGAY</button>
    </form>

    <div class="auth-footer text-muted">
        Bạn đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
