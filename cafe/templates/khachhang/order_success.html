{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đặt hàng thành công!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { background: #fdfaf7; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; }
        .success-card { background: white; padding: 50px; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center; max-width: 500px; }
        .icon-box { color: #1e7f3f; font-size: 80px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="icon-box"><i class="fa-solid fa-circle-check"></i></div>
        <h2 class="fw-bold">ĐẶT ĐƠN THÀNH CÔNG!</h2>
        <p class="text-muted mt-3">Mã đơn hàng của bạn là: <strong>#{{ madon }}</strong></p>
        <p>Cảm ơn bạn đã tin tưởng CafeHouse. Đơn hàng đang được quán chuẩn bị, vui lòng chờ ship nhé! 🛵💨</p>
        <hr class="my-4 opacity-25">
        <a href="{% url 'Menu' %}" class="btn btn-success px-5 py-2 shadow-sm" style="border-radius: 20px;">
            TIẾP TỤC MUA SẮM
        </a>
    </div>
</body>
</html>
