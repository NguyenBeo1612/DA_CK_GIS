<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Khu vực hạn chế</title>
    <style>
        body { text-align: center; padding: 50px; font-family: 'Segoe UI', sans-serif; background: #fdf5e6; }
        .icon { font-size: 80px; margin-bottom: 20px; }
        h1 { color: #8b4513; }
        p { color: #555; font-size: 18px; }
        .btn { 
            display: inline-block; margin-top: 20px; padding: 10px 25px; 
            background: #8b4513; color: #fff; text-decoration: none; border-radius: 5px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">☕🚫</div> 
        
        <h1>Úi! Khu vực này "Hạn Chế" rồi ní ơi...</h1>
        
        <p>
            Trang này chỉ dành riêng cho <b>Đội ngũ Nhân viên</b> của quán thôi.<br>
            Có vẻ như ní đã vô tình đi nhầm vào "quầy pha chế" nội bộ rồi nè!
        </p>

        <p style="font-size: 16px; color: #6d4c41;">
            Ní vui lòng quay lại trang chọn món để tiếp tục thưởng thức những ly cafe thơm ngon nhé!
        </p>
        
        <div style="margin-top: 30px;">
            <a href="/" class="btn" style="background: #8b4513; border-radius: 30px; padding: 12px 35px;">
                Quay lại đặt món ngay ☕
            </a>
        </div>
    </div>
</body>
</html>
