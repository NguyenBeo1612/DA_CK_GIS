<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán thành công</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .invoice-box { max-width: 600px; margin: 50px auto; padding: 30px; background: #fff; border-radius: 12px;
                       box-shadow: 0 0 20px rgba(0,0,0,0.1); font-size:16px; line-height:24px; color:#555; }
        .success-icon { color: #28a745; font-size:4rem; margin-bottom:15px; }
        .line-item { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dotted #ccc; }
        .total-row { font-weight:bold; font-size:1.1em; color:#333; border-top:2px solid #333; margin-top:10px; padding-top:10px; }
    </style>
</head>
<body>
<div class="invoice-box">
    <div class="text-center">
        <i class="fas fa-check-circle success-icon"></i>
        <h2 class="text-success mb-3" th:text="${message}">Thanh Toán Thành Công!</h2>
        <p class="text-muted">Giao dịch đã được hoàn tất.</p>
    </div>

    <hr class="my-4">

    <div class="row mb-3">
        <div class="col-6">
            <p class="fw-bold mb-1">Mã đơn:</p>
            <p th:text="${donHang.maDon}"></p>
        </div>
        <div class="col-6 text-end">
            <p class="fw-bold mb-1">Nhân viên:</p>
            <p th:text="${donHang.nhanVien.hoTen}"></p>
        </div>
    </div>

    <h5 class="fw-bold text-primary border-bottom pb-2">Chi Tiết Sản Phẩm</h5>
    <div th:each="ct : ${donHang.chiTietDonHang}" class="line-item">
        <span th:text="${ct.thucDon.tenMon + (ct.sizeMon != null ? ' (' + ct.sizeMon.tenSize + ')' : '') + ' x' + ct.soLuong}">Món x1</span>
        <span th:text="${#numbers.formatInteger(ct.soLuong * ct.thucDon.gia,0,'POINT')} + ' đ'">0 đ</span>
    </div>

    <div class="mt-4">
        <h5 class="fw-bold text-primary border-bottom pb-2">Tóm Tắt Giao Dịch</h5>

        <div class="line-item">
            <span>Tạm tính (chưa VAT):</span>
            <span class="fw-bold" th:text="${#numbers.formatInteger(tamTinh,0,'POINT')} + ' đ'">0 đ</span>
        </div>
        <div class="line-item">
            <span>VAT (10%):</span>
            <span class="fw-bold" th:text="${#numbers.formatInteger(vat,0,'POINT')} + ' đ'">0 đ</span>
        </div>

        <!-- Hiển thị khuyến mãi và giảm giá nếu có -->
        <div th:if="${khuyenMaiText != ''}">
            <div class="line-item">
                <span>Khuyến mãi:</span>
                <span class="fw-bold text-success" th:text="${khuyenMaiText}">KM 20%</span>
            </div>
            <div class="line-item">
                <span>Giảm:</span>
                <span class="fw-bold text-success" th:text="${#numbers.formatInteger(giamGia,0,'POINT')} + ' đ'">0 đ</span>
            </div>
        </div>

        <div class="line-item total-row">
            <span>TỔNG TIỀN THANH TOÁN:</span>
            <span class="text-danger" th:text="${#numbers.formatInteger(tongTien,0,'POINT')} + ' VNĐ'">0 VNĐ</span>
        </div>

        <hr class="mt-3 mb-3">
        <p class="mb-1">Phương thức: <span class="fw-bold text-dark" th:text="${donHang.phuongThuc}">Tiền mặt</span></p>
    </div>

    <div class="text-center mt-5">
        <a th:href="@{/chitiet}" class="btn btn-primary btn-lg me-3">
            <i class="fas fa-list-alt me-1"></i> Quay lại Danh sách Đơn
        </a>
        <a th:href="@{/donhang}" class="btn btn-success btn-lg">
            <i class="fas fa-cash-register me-1"></i> Tạo Đơn Hàng Mới
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
