{% load static %}
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${danhmuc.maDanhMuc != null} ? 'Sửa Danh Mục' : 'Thêm Danh Mục'"></title>
    <link rel="stylesheet" href="{% static 'main/css/style.css'%}">
</head>
<body>
    <div class="container">
        <header>
            <h1 th:text="${danhmuc.maDanhMuc != null} ? 'Sửa Danh Mục' : 'Thêm Danh Mục'">Quản Lý Danh Mục</h1>
        </header>

        <div class="card">
            <h2 th:text="${danhmuc.maDanhMuc != null} ? 'Chỉnh sửa thông tin danh mục' : 'Thêm danh mục mới'"></h2>
            
            <form th:action="@{/danhmuc/save}" th:object="${danhmuc}" method="post">
                
                <input type="hidden" th:field="*{maDanhMuc}">
                
                <label for="tenDanhMuc">Tên Danh Mục:</label>
                <input type="text" id="tenDanhMuc" th:field="*{tenDanhMuc}" placeholder="Nhập tên danh mục" required>
                
                <div class="btn-group" style="margin-top: 20px;">
                    <button type="submit" class="btn">Lưu</button>
                    <a th:href="@{/danhmuc}" class="btn">Quay lại</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
