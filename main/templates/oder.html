{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Mao Coffee Admin - Hệ thống Điều phối GIS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        :root {
            --primary: #6F4E37;
            --success: #27ae60;
            --info: #2980b9;
            --warning: #f39c12;
            --bg: #f4f7f6;
            --sidebar: #1a1a1a;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0; display: flex;
            background-color: var(--bg);
            height: 100vh; overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px; background: var(--sidebar);
            color: white; padding: 25px;
            display: flex; flex-direction: column;
        }

        .nav-link {
            display: flex; align-items: center; gap: 12px;
            color: #888; text-decoration: none;
            padding: 12px; border-radius: 8px; margin-bottom: 5px;
        }
        .nav-link.active { background: var(--primary); color: white; }

        /* Main Area */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        
        #order-container { display: flex; flex-direction: column; gap: 20px; }

        /* Order Card */
        .order-card {
            background: white; border-radius: 15px; padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex; justify-content: space-between;
            border-left: 6px solid var(--warning);
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .order-info h3 { margin: 0 0 10px 0; color: var(--sidebar); }

        .progress-container {
            display: flex; gap: 20px; margin-top: 15px;
            border-top: 1px solid #eee; padding-top: 15px;
        }

        .step { font-size: 12px; color: #ccc; display: flex; align-items: center; gap: 5px; }
        .step.active { color: var(--success); font-weight: bold; }

        .btn {
            border: none; padding: 10px 18px; border-radius: 8px;
            cursor: pointer; font-weight: 600; transition: 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: #f0f4f8; color: var(--info); }

        /* Map Modal */
        #map-modal {
            display: none; position: fixed; z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            justify-content: center; align-items: center;
        }
        .modal-body { width: 80%; height: 80%; background: white; border-radius: 20px; overflow: hidden; position: relative; }
        #map-canvas { width: 100%; height: 100%; }
        .close-btn { position: absolute; top: 15px; right: 15px; z-index: 1001; background: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; }
        .shipper-icon { color: #e67e22; filter: drop-shadow(0 0 5px rgba(0,0,0,0.5)); }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 style="color: var(--primary); letter-spacing: -1px;">MAO ADMIN</h2>
        <div class="nav-menu">
            <a href="#" class="nav-link active"><i class="fas fa-list"></i> Đơn hàng mới <span id="order-count" style="background:red; color:white; border-radius:50%; padding:2px 7px; font-size:10px; margin-left:auto;">0</span></a>
            <a href="#" class="nav-link"><i class="fas fa-motorcycle"></i> Đang giao</a>
            <a href="#" class="nav-link"><i class="fas fa-store"></i> Chi nhánh</a>
        </div>
    </div>

    <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2>Điều phối đơn hàng Real-time</h2>
            <button class="btn btn-outline" onclick="localStorage.clear(); location.reload();">Xóa tất cả đơn</button>
        </div>

        <div id="order-container">
            </div>
    </div>

    <div id="map-modal">
        <div class="modal-body">
            <button class="close-btn" onclick="closeMap()">✕</button>
            <div id="map-canvas"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Tọa độ các chi nhánh (phải khớp với bên khách hàng)
        const branchCoords = {
            "Mao Coffee Quận 1": [10.7797, 106.6990],
            "Mao Coffee Bình Thạnh": [10.7948, 106.7218],
            "Mao Coffee Quận 5": [10.7516, 106.6633]
        };

        var map = L.map('map-canvas').setView([10.776, 106.700], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        var shipperMarker, routeLine;

        // 1. Hàm tự động quét đơn hàng mới từ Khách hàng
        function syncOrders() {
            const container = document.getElementById('order-container');
            const orders = JSON.parse(localStorage.getItem('mao_orders')) || [];
            document.getElementById('order-count').innerText = orders.length;

            orders.forEach(order => {
                if (!document.getElementById(`order-${order.id}`)) {
                    const html = `
                        <div class="order-card" id="order-${order.id}">
                            <div class="order-info">
                                <h3>Đơn hàng #${order.id}</h3>
                                <p><i class="fas fa-user"></i> <b>${order.customer}</b> | <i class="fas fa-map-marker-alt"></i> ${order.branch}</p>
                                <p style="color: #666;">${order.items}</p>
                                <div class="progress-container">
                                    <div class="step active" id="s-${order.id}-1"><i class="fas fa-check"></i> Đã nhận</div>
                                    <div class="step" id="s-${order.id}-2"><i class="fas fa-fire"></i> Chế biến</div>
                                    <div class="step" id="s-${order.id}-3"><i class="fas fa-truck"></i> Đang giao</div>
                                </div>
                            </div>
                            <div style="text-align: right; display: flex; flex-direction: column; gap: 10px; justify-content: center;">
                                <div id="label-${order.id}" style="font-weight: bold; color: var(--warning);">Mới nhận (${order.total})</div>
                                <button class="btn btn-primary" id="btn-${order.id}" onclick="processOrder(${order.id}, '${order.branch}')">Tiếp nhận đơn</button>
                                <button class="btn btn-outline" onclick="viewLocation('${order.branch}')">Vị trí chi nhánh</button>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('afterbegin', html);
                }
            });
        }

        // 2. Xử lý trạng thái và GIS Shipper
        function processOrder(id, branchName) {
            const btn = document.getElementById('btn-' + id);
            const label = document.getElementById('label-' + id);

            if (btn.innerText === "Tiếp nhận đơn") {
                document.getElementById(`s-${id}-2`).classList.add('active');
                label.innerText = "Đang chế biến...";
                btn.innerText = "Giao hàng ngay";
                btn.style.background = "#2980b9";
            } else if (btn.innerText === "Giao hàng ngay") {
                document.getElementById(`s-${id}-3`).classList.add('active');
                label.innerText = "Shipper đang giao...";
                label.style.color = "#27ae60";
                btn.innerText = "Hoàn tất đơn";
                btn.style.background = "#27ae60";
                
                // Lấy tọa độ chi nhánh đó để Shipper bắt đầu đi
                const startPos = branchCoords[branchName] || [10.7797, 106.6990];
                // Giả lập tọa độ khách hàng gần đó
                const endPos = [startPos[0] - 0.005, startPos[1] + 0.005]; 
                
                startShipperDelivery(startPos, endPos);
            } else {
                alert("Đơn hàng đã hoàn tất!");
                document.getElementById(`order-${id}`).style.opacity = "0.5";
            }
        }

        // 3. Hiệu ứng Shipper di chuyển trên Map
        function startShipperDelivery(sPos, ePos) {
            document.getElementById('map-modal').style.display = 'flex';
            setTimeout(() => { map.invalidateSize(); }, 300);

            if (routeLine) map.removeLayer(routeLine);
            if (shipperMarker) map.removeLayer(shipperMarker);

            routeLine = L.polyline([sPos, ePos], {color: '#6F4E37', weight: 5, dashArray: '10, 15'}).addTo(map);
            
            const motorIcon = L.divIcon({
                html: '<i class="fas fa-motorcycle fa-2x shipper-icon"></i>',
                iconSize: [30, 30], className: 'dummy'
            });
            shipperMarker = L.marker(sPos, {icon: motorIcon}).addTo(map);
            map.fitBounds(routeLine.getBounds(), {padding: [50, 50]});

            let step = 0;
            const interval = setInterval(() => {
                step++;
                let r = step / 100;
                let lat = sPos[0] + (ePos[0] - sPos[0]) * r;
                let lng = sPos[1] + (ePos[1] - sPos[1]) * r;
                shipperMarker.setLatLng([lat, lng]);

                if (step >= 100) {
                    clearInterval(interval);
                    shipperMarker.bindPopup("<b>Shipper đã giao tới khách!</b>").openPopup();
                }
            }, 50);
        }

        function viewLocation(branchName) {
            const pos = branchCoords[branchName];
            document.getElementById('map-modal').style.display = 'flex';
            setTimeout(() => { 
                map.invalidateSize();
                map.setView(pos, 16);
                L.marker(pos).addTo(map).bindPopup(branchName).openPopup();
            }, 300);
        }

        function closeMap() { document.getElementById('map-modal').style.display = 'none'; }

        // Chạy quét đơn mỗi 2 giây
        setInterval(syncOrders, 2000);
        syncOrders();
    </script>
</body>
</html>
