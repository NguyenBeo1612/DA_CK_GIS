{% load static %}
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Thực Đơn</title>
    <link rel="stylesheet" href="{% static 'main/css/style.css'%}">
</head>
<body>
<div class="container">
    <header>
        <h1>Quản lý Thực Đơn</h1>
    </header>

    <p th:if="${currentUser != null}">
        Xin chào <span th:text="${currentUser.hoTen}"></span> 
        (<span th:text="${currentUser.chucVu}"></span>)
    </p>

    <div class="btn-group" style="display:flex; justify-content:flex-end; gap:10px; margin:15px 0;">
        <a th:href="@{/logout}" class="btn">Đăng xuất</a>
        <a th:href="@{/quanli}" class="btn">Quay lại</a>
        <a th:href="@{/thucdon/add}" class="btn" th:if="${isAdmin}">Thêm món mới</a>
    </div>

    <!-- ⭐ SEARCH: thêm form tìm kiếm -->
    <form th:action="@{/thucdon/search}" method="get" style="margin-bottom:15px; display:flex; gap:10px;">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm món..." style="flex:1; padding:5px;"/>
        <button type="submit" class="btn">Search</button>
    </form>

    <table>
        <thead>
        <tr>
            <th>Mã Món</th>
            <th>Tên Món</th>
            <th>Danh Mục</th>
            <th>Mô Tả</th>
            <th>Hình Ảnh</th>
            <th>Giá</th>
            <th>Tình Trạng</th>
            <th th:if="${isAdmin}">Hành động</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="mon : ${thucdonList}">
            <td th:text="${mon.maMon}"></td>
            <td th:text="${mon.tenMon}"></td>
            <td th:text="${mon.danhMuc != null ? mon.danhMuc.tenDanhMuc : 'Chưa chọn'}"></td>
            <td th:text="${mon.moTa}"></td>

            <!-- Hình ảnh -->
            <td>
                <img th:if="${mon.hinhAnh != null}" 
                     th:src="@{/images/hinhAnh/{file}(file=${mon.hinhAnh})}"  
                     alt="Ảnh món" 
                     style="width:70px; height:70px; object-fit:cover; border-radius:6px;">
            </td>
            

            <td th:text="${#numbers.formatDecimal(mon.gia, 0, 'POINT', 0, 'COMMA')} + ' VNĐ'"></td>
         <td th:text="${mon.tinhTrang != null and mon.tinhTrang ? 'Đang bán' : 'Ngừng bán'}"></td>


            <td th:if="${isAdmin}">
                <div class="action-buttons">
                    <a th:href="@{/thucdon/edit/{id}(id=${mon.maMon})}" class="btn">Sửa</a>
                    <a th:href="@{/thucdon/delete/{id}(id=${mon.maMon})}" 
                       class="btn btn-delete" 
                       onclick="return confirm('Bạn có chắc muốn xóa món này không?');">
                        Xóa
                    </a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
